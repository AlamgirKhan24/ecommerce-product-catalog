<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Nitec Store</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">
  <main class="neo-shell">
    <header class="neo-nav" aria-label="Primary navigation">
      <a class="neo-brand" href="index.html" aria-label="Nitec home">
        <span class="neo-brand__mark"></span>
        <span>nitec.</span>
      </a>

      <form class="neo-search" role="search">
        <label class="visually-hidden" for="contact-search">Search products</label>
        <input id="contact-search" type="search" placeholder="Search products...">
        <button type="submit" aria-label="Search products">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4.2-4.2"></path>
          </svg>
        </button>
      </form>

      <div class="neo-actions">
        <a class="neo-icon" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 8h14l-1.5 9h-11z"></path>
            <path d="M7 8 6.2 5H3"></path>
            <path d="M10 8a2 2 0 0 1 4 0"></path>
            <circle cx="10" cy="20" r="1"></circle>
            <circle cx="18" cy="20" r="1"></circle>
          </svg>
        </a>

        <a class="neo-icon neo-icon--heart" href="wishlist.html" aria-label="Wishlist">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.5 5.4c-1.7-1.7-4.4-1.7-6.1 0L12 6.8l-1.4-1.4c-1.7-1.7-4.4-1.7-6.1 0s-1.7 4.4 0 6.1L12 19l7.5-7.5c1.7-1.7 1.7-4.4 0-6.1Z"></path>
          </svg>
        </a>

        <a class="neo-user" href="about.html">
          <span>Ryman Alex</span>
          <span class="neo-user__avatar" aria-hidden="true"></span>
        </a>
      </div>
    </header>

    <section class="contact-hero">
      <div>
        <span class="neo-kicker">Support Center</span>
        <h1>Let’s Talk About Your Order.</h1>
        <p>Need product help, order support, or catalog information? Send a message and the support team will reply soon.</p>
      </div>

      <div class="contact-hero__badge">
        <strong>24h</strong>
        <span>Average reply</span>
      </div>
    </section>

    <section class="contact-layout">
      <aside class="contact-info">
        <article>
          <span>01</span>
          <h2>Email</h2>
          <p>support@nitec.store</p>
        </article>

        <article>
          <span>02</span>
          <h2>Phone</h2>
          <p>+1 555 204 8890</p>
        </article>

        <article>
          <span>03</span>
          <h2>Hours</h2>
          <p>Monday to Friday, 9:00 - 18:00</p>
        </article>
      </aside>

      <form class="contact-form-panel">
        <div class="contact-form-panel__grid">
          <label>
            Name
            <input type="text" placeholder="Your name">
          </label>

          <label>
            Email
            <input type="email" placeholder="you@example.com">
          </label>
        </div>

        <label>
          Subject
          <input type="text" placeholder="Order or product question">
        </label>

        <label>
          Message
          <textarea placeholder="Write your message..."></textarea>
        </label>

        <button class="neo-cta" type="button">
          Send Message
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 17 17 7"></path>
              <path d="M8 7h9v9"></path>
            </svg>
          </span>
        </button>
      </form>
    </section>
  </main>
</body>
</html>
