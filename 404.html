<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | Nitec Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.1.4/swiper-bundle.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="icon" href="favicon.ico">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>
<body class="home-page">
  <main class="neo-shell">
    <header class="neo-nav" aria-label="Primary navigation">
      <a class="neo-brand" href="index.html" aria-label="Nitec home">
        <span class="neo-brand__mark"></span>
        <span>nitec.</span>
      </a>

      <form class="neo-search" role="search">
        <label class="visually-hidden" for="error-search">Search products</label>
        <input id="error-search" type="search" placeholder="Search products...">
        <button type="submit" aria-label="Search products">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4.2-4.2"></path>
          </svg>
        </button>
      </form>

      <div class="neo-actions">
        <a class="neo-icon" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 8h14l-1.5 9h-11z"></path>
            <path d="M7 8 6.2 5H3"></path>
            <path d="M10 8a2 2 0 0 1 4 0"></path>
            <circle cx="10" cy="20" r="1"></circle>
            <circle cx="18" cy="20" r="1"></circle>
          </svg>
        </a>

        <a class="neo-icon neo-icon--heart" href="wishlist.html" aria-label="Wishlist">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.5 5.4c-1.7-1.7-4.4-1.7-6.1 0L12 6.8l-1.4-1.4c-1.7-1.7-4.4-1.7-6.1 0s-1.7 4.4 0 6.1L12 19l7.5-7.5c1.7-1.7 1.7-4.4 0-6.1Z"></path>
          </svg>
        </a>

        <a class="neo-user" href="about.html">
          <span>Ryman Alex</span>
          <span class="neo-user__avatar" aria-hidden="true"></span>
        </a>
      </div>
    </header>

    <section class="error-page">
      <div class="error-page__copy">
        <span class="neo-kicker">Page Not Found</span>
        <strong>404</strong>
        <h1>This product path is out of stock.</h1>
        <p>The page you opened does not exist, moved, or is no longer available in the catalog.</p>

        <div class="error-page__actions">
          <a class="neo-cta" href="index.html">
            Back Home
            <span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 17 17 7"></path>
                <path d="M8 7h9v9"></path>
              </svg>
            </span>
          </a>

          <a class="neo-section-link" href="shop.html">
            Shop products
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 17 17 7"></path>
              <path d="M8 7h9v9"></path>
            </svg>
          </a>
        </div>
      </div>

      <div class="error-page__visual">
        <span class="error-orbit"></span>
        <span class="error-dot error-dot--one"></span>
        <span class="error-dot error-dot--two"></span>
        <img src="assets/images/products/product-02.svg" alt="Product illustration">
      </div>
    </section>
    <footer class="neo-footer-strip">
  <div>
    <strong>nitec.</strong>
    <span>Premium ecommerce catalog for modern tech essentials.</span>
  </div>

  <nav aria-label="Footer navigation">
    <a href="shop.html">Shop</a>
    <a href="product.html">Product</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="cart.html">Cart</a>
  </nav>
</footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.1.4/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/umd/photoswipe.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/umd/photoswipe-lightbox.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://cdn.jsdelivr.net/npm/countup.js@2.8.0/dist/countUp.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.11/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.11/plugin/relativeTime.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lazysizes@5.3.2/lazysizes.min.js" async></script>
<script type="module" src="js/sidebar.js"></script>
<script type="module" src="js/core/app.js"></script>

</body>
</html>
